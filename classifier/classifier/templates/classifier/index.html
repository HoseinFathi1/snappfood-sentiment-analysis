{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحلیل احساسات نظرات اسنپ‌فود</title>
    <style>
        :root {
            --snapp-pink: #FF00A4;
            --snapp-pink-dark: #C8085B;
            --text-dark: #222222;
            --happy-bg: #E8F8F5;
            --happy-border: #2ECC71;
            --happy-text: #1E8449;
            --sad-bg: #FDEDEC;
            --sad-border: #E74C3C;
            --sad-text: #922B21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, 'Vazirmatn', sans-serif;
            background-color: var(--snapp-pink);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #FFFFFF;
            width: 100%;
            max-width: 580px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            padding: 35px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-img {
            width: 180px;
            height: auto;
            margin-bottom: 12px;
            display: inline-block;
        }

        .header h1 {
            font-size: 19px;
            color: var(--text-dark);
            margin-top: 6px;
        }

        .header p {
            font-size: 13px;
            color: #666666;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        textarea {
            width: 100%;
            height: 120px;
            font-family: inherit;
            font-size: 15px;
            padding: 14px;
            border: 2px solid #EAEAEA;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            resize: vertical;
            background-color: #FAFAFA;
        }

        textarea:focus {
            border-color: var(--snapp-pink);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(236, 12, 109, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            background-color: var(--snapp-pink);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 6px 18px rgba(236, 12, 109, 0.3);
        }

        button:hover {
            background-color: var(--snapp-pink-dark);
        }

        button:active {
            transform: scale(0.99);
        }

        .result-card {
            margin-top: 25px;
            padding: 18px 20px;
            border-radius: 14px;
            animation: fadeIn 0.3s ease-in-out;
            border-right: 6px solid;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card.happy {
            background-color: var(--happy-bg);
            border-color: var(--happy-border);
            color: var(--happy-text);
        }

        .result-card.sad {
            background-color: var(--sad-bg);
            border-color: var(--sad-border);
            color: var(--sad-text);
        }

        .result-header {
            display: flex;
            align-items: center;
            font-size: 17px;
            font-weight: bold;
        }

        .result-header .emoji {
            font-size: 24px;
            margin-left: 10px;
        }

        .confidence-container {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed rgba(0, 0, 0, 0.1);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="{% static 'snappfood-logo.svg' %}" alt="اسنپ فود" class="logo-img">
            <h1> سامانه تحلیل احساسات </h1>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="text">لطفا نظر خودتون رو وارد کنید:</label>
                <textarea id="text" name="text" placeholder="مثلاً: غذا خیلی خوشمزه بود و سریع رسید">{{ submitted_text }}</textarea>
            </div>
            <button type="submit">ثبت </button>
        </form>

        {% if result %}
            <div class="result-card {% if result.label == 'Happy' %}happy{% else %}sad{% endif %}">
                <div class="result-header">
                    {% if result.label == 'Happy' %}
                        <span>احساس مثبت (Happy)</span>
                    {% else %}
                        <span>احساس منفی (Sad)</span>
                    {% endif %}
                </div>
                
                <div class="confidence-container">
                    <span>میزان اطمینان مدل:</span>
                    <strong>{{ result.confidence }}</strong>
                </div>
            </div>
        {% endif %}
    </div>

    <div class="footer">
        سامانه پردازش زبان طبیعی نظرات اسنپ‌فود
    </div>

</body>
</html>
